<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - FindIt AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header"></header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div class="brand-icon" style="width: 44px; height: 44px; margin: 0 auto 0.75rem; border-radius: var(--radius-lg);">
            <span class="material-symbols-outlined fill" style="font-size: 24px;">auto_awesome</span>
          </div>
          <h1 style="font-size: 1.5rem;">Student Sign In</h1>
          <p style="font-size: 0.75rem; color: var(--on-surface-variant); margin-top: 0.25rem;">
            Access your campus reports, track verifications, and recover belongings.
          </p>
        </div>

        <div id="loginAlert" style="display: none;" class="alert alert-error"></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="username">Campus Username *</label>
            <div class="input-with-icon">
              <span class="material-symbols-outlined">person</span>
              <input type="text" id="username" class="form-input" required autocomplete="username" placeholder="e.g. alex_chen" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <div class="input-with-icon" style="position: relative;">
              <span class="material-symbols-outlined">lock</span>
              <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••" style="padding-right: 2.5rem;" />
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--outline); cursor: pointer;" aria-label="Toggle password visibility">
                <span class="material-symbols-outlined" id="togglePasswordIcon" style="font-size: 18px;">visibility</span>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn" style="margin-top: 1rem;">
            Sign In
          </button>
        </form>

        <p style="font-size: 0.75rem; text-align: center; color: var(--on-surface-variant); margin-top: 1.25rem;">
          Don't have an account yet? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
